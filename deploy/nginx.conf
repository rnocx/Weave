# Public Weave: static files only. No backend, no relay proxying, no logs.
# Build the files first: deploy/build-public.sh, then copy deploy/dist/* to
# /var/www/weave. Replace weave.example.com and the certificate paths
# (e.g. from certbot) with your own.

server {
    listen 80;
    listen [::]:80;
    server_name weave.example.com;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weave.example.com;

    ssl_certificate     /etc/letsencrypt/live/weave.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weave.example.com/privkey.pem;

    # No access log; the error log only gets critical server problems, not
    # per-request entries with client addresses.
    access_log off;
    error_log /var/log/nginx/weave-error.log crit;
    log_not_found off;
    server_tokens off;

    root /var/www/weave;
    index index.html;
    etag on;

    # Repeated in each location because add_header isn't inherited once a
    # location sets its own.
    set $csp "frame-ancestors 'none'";   # only works as a header; the rest is in index.html
    set $pp  "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), browsing-topics=()";

    # Only the app's own files; everything else is a bare 404.
    location ~ ^/(|index\.html|weave\.css|weave\.js|weave\.zip)$ {
        add_header Content-Security-Policy $csp always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy $pp always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        # Revalidate on every load (ETag), so updates reach users promptly.
        add_header Cache-Control no-cache always;
        try_files $uri /index.html;
    }
    location / {
        return 404;
    }
}
